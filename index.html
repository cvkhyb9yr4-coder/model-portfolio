<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Jul Michèle Buch Vera — model, actress and creative based in Barcelona, Spain.">
    <meta property="og:title" content="Jul Michèle Buch Vera — Portfolio">
    <meta property="og:description" content="Model, actress and creative based in Barcelona, Spain.">
    <meta property="og:type" content="website">

    <title>Jul Michèle Buch Vera — Portfolio</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="#home" class="brand-name">JUL MICHÈLE BUCH VERA</a>
            </div>
            <ul class="navbar-menu">
                <li><a href="#portfolio" class="nav-link">PORTFOLIO</a></li>
                <li><a href="#polaroids" class="nav-link">POLAROIDS</a></li>
                <li><a href="#contact" class="nav-link">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="hero-image-container">
            <img
                src="images/project1/005781-015-VK.JPG"
                alt="Jul Michèle Buch Vera portfolio image"
                class="hero-image"
                fetchpriority="high"
            >
        </div>
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-name">JUL MICHÈLE BUCH VERA</h1>
                <p class="hero-title">MODEL, ACTRESS, CREATIVE</p>
            </div>
            <div class="hero-scroll">
                <span class="scroll-indicator">SCROLL TO EXPLORE</span>
                <svg class="scroll-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                    <path d="M12 5v14M19 13l-7 7-7-7"></path>
                </svg>
            </div>
        </div>
    </section>

    <section id="portfolio" class="portfolio">
        <div id="portfolio-container" class="portfolio-container"></div>
    </section>

    <section id="polaroids" class="polaroids">
        <div id="polaroids-container" class="polaroids-container"></div>
    </section>

    <div id="project-viewer" class="project-viewer">
        <div class="project-viewer-content" id="project-viewer-content">
            <div class="project-image-container" id="project-image-container">
                <img id="project-image" src="" alt="" class="project-image">
            </div>

            <button class="project-nav-button project-nav-prev" id="project-nav-prev" aria-label="Previous image">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button class="project-nav-button project-nav-next" id="project-nav-next" aria-label="Next image">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5l7 7-7 7"></path></svg>
            </button>
            <button class="project-viewer-close" id="project-viewer-close" aria-label="Close project">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>

            <div class="project-info" id="project-info">
                <div class="project-info-scroll">
                    <h2 class="project-info-title" id="project-title"></h2>
                    <p class="project-info-description" id="project-description"></p>
                    <div class="project-credits" id="project-credits"></div>
                </div>
            </div>
            <div class="project-counter" id="project-counter">1 / 1</div>
        </div>
    </div>

    <section id="contact" class="contact">
        <div class="contact-container">
            <div class="contact-header">
                <h2 class="contact-name">Jul Michèle Buch Vera</h2>
                <p class="contact-title">Model, Actress, Creative</p>
            </div>
            <div class="contact-location"><p>Based in <span id="contact-city">Barcelona, Spain</span></p></div>
            <div class="contact-info">
                <div class="contact-item"><label>EMAIL</label><a href="mailto:juliabuchvera@gmial.com" class="contact-link">juliabuchvera@gmial.com</a></div>
                <div class="contact-item"><label>INSTAGRAM</label><a href="https://instagram.com/jijijii.png" target="_blank" rel="noopener noreferrer" class="contact-link">@jijijii.png</a></div>
            </div>
            <div class="contact-cta"><a href="mailto:juliabuchvera@gmial.com" class="cta-button">CONTACT ME</a></div>
        </div>
    </section>

    <script src="script.js?v=20260921"></script>
</body>
</html>
